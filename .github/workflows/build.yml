name: Сборка «Штиль» для компьютера

# Собираем в облаке, а не на своей машине: Windows-установщик собирается только
# на Windows, файл для macOS — только на macOS. Заодно ядро sing-box тянется с
# GitHub, что из России напрямую не всегда доходит.
#
# Имена работ и полей матрицы — латиницей: GitHub принимает в них только
# латинские буквы, цифры, дефис и подчёркивание. Человеческие названия живут
# в поле `name`.

on:
  push:
    # Своё пространство имён, не общее `v*`: апстрим живёт на версиях 2.x, и его
    # тег, попав сюда при следующем подтягивании, выглядел бы «новее» нашего 1.0.0
    # и запускал бы выкладку чужой сборки под нашим именем.
    tags: ['desktop-v*']
  workflow_dispatch:

jobs:
  checks:
    name: Тесты и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Системные библиотеки Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - name: Тесты ядра приложения
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.title }}
    needs: checks
    # Без права записи сборщик не может выложить готовые файлы: приложение
    # собирается, а публикация падает на «нет доступа».
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, title: Windows, args: '', slug: windows }
          - { os: macos-latest, title: 'macOS (Apple)', args: '--target aarch64-apple-darwin', slug: macos-apple }
          - { os: macos-15-intel, title: 'macOS (Intel)', args: '--target x86_64-apple-darwin', slug: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: pnpm install --frozen-lockfile
      - name: Ядро sing-box в сборку
        run: pnpm kernel:fetch
      - name: Версия из тега
        id: ver
        # Тег зовётся desktop-v1.0.1, но на странице скачивания человек должен
        # видеть «Штиль VPN 1.0.1», а не наше служебное пространство имён.
        run: echo "value=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Наша подпись обновления (не подпись издателя — её нет и не будет).
          # Без неё приложение откажется ставить то, что мы ему пришлём.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Штиль VPN ${{ steps.ver.outputs.value }}'
          releaseDraft: true
          releaseBody: |
            Приложение «Штиль» для компьютера.

            **Windows** — скачайте файл `.exe`, запустите. Windows покажет
            «неизвестный издатель»: нажмите «Подробнее» → «Выполнить в любом
            случае». Так будет у любого приложения, которое раздаётся мимо
            магазина.

            **macOS** — скачайте `.dmg` под свой процессор (Apple или Intel),
            перетащите в «Программы». При первом запуске система не пустит:
            Системные настройки → Конфиденциальность и безопасность →
            «Открыть всё равно».

            Ключ берётся из бота @RealityVPNBot_bot.

      # Запасной путь: даже если выкладка релиза не удалась, готовые файлы
      # остаются здесь и их можно скачать вручную.
      - name: Готовые файлы отдельно
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig
