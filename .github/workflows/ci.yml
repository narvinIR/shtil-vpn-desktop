name: CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Проверка идёт на КАЖДОЙ системе, куда поедет приложение. До 15.08.2026 весь
  # набор гонялся только на Linux — а Linux мы даже не выпускаем: язык не проверяет
  # типы внутри выключенной ветки `#[cfg(target_os = …)]`, поэтому 81 кусок кода под
  # Windows и macOS (из 189) не видел ни один прогон, и поломка всплывала на кнопке
  # выпуска. Проверено предметом: ошибка типов в маковской ветке даёт на Linux
  # «Finished», на Маке — «could not compile».
  check:
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, title: 'Linux (эталон, весь набор)', full: true }
          - { os: windows-latest, title: 'Windows', full: false }
          - { os: macos-latest, title: 'macOS (Apple)', full: false }
          - { os: macos-15-intel, title: 'macOS (Intel)', full: false }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file rpm libxdo-dev libssl-dev librsvg2-dev librsvg2-common \
            pango1.0-tools libcairo2-dev libgdk-pixbuf2.0-dev libglib2.0-dev libsoup2.4-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Фронт одинаков на всех системах — гоняем один раз, на эталоне.
      - name: Frontend lint
        if: matrix.full
        run: pnpm lint

      - name: Frontend type-check
        if: matrix.full
        run: pnpm type-check

      - name: Script tests
        if: matrix.full
        run: pnpm test:scripts

      # А вот это — ради чего заведена матрица: типы и придирки компилятора внутри
      # веток своей системы. На чужой системе они не проверяются в принципе.
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml
